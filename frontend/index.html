<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
    <title>Bioinformática UBB - Permutaciones y Reversals</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="flex min-h-screen">
      <!-- Barra lateral de configuración -->
      <aside
        id="sidebar"
        data-state="expanded"
        data-mobile-state="closed"
        class="fixed inset-y-0 left-0 z-30 flex flex-col gap-4 overflow-y-auto border-r border-md-outline-variant bg-md-surface-container-high p-4 shadow-sm thin-scroll"
        aria-label="Panel de configuración"
      >
        <header class="flex items-center gap-3 border-b border-md-outline-variant pb-3">
          <img
            src="/images/ubb.png"
            alt="Logotipo de la Universidad del Bío-Bío"
            class="h-11 w-11 shrink-0 rounded-md object-contain"
            onerror="this.src='/images/favicon.ico'"
          />
          <div class="sidebar-text flex min-w-0 flex-col leading-tight">
            <span class="truncate text-[15px] font-bold text-md-on-surface">Bioinformática</span>
            <span class="truncate text-[11px] text-md-on-surface-variant">Laboratorio · Reordenamientos</span>
          </div>
          <button
            id="sidebar-toggle"
            type="button"
            title="Contraer barra lateral"
            aria-label="Contraer la barra lateral"
            aria-expanded="true"
            class="ml-auto flex h-8 w-8 shrink-0 items-center justify-center rounded-md border border-md-outline-variant bg-md-surface-bright/80 text-md-on-surface transition hover:bg-md-surface-bright"
          ></button>
        </header>

        <nav
          id="sidebar-nav"
          class="flex flex-col gap-1"
          aria-label="Navegación de funciones"
        ></nav>

        <div id="sidebar-fields" class="flex flex-col gap-3"></div>
      </aside>

      <div
        id="sidebar-backdrop"
        class="fixed inset-0 z-20 hidden bg-md-on-surface/40 md:hidden"
        aria-hidden="true"
      ></div>

      <!-- Área principal -->
      <main id="home" class="min-w-0 flex-1 bg-md-surface p-4 sm:p-6" data-sidebar="expanded">
        <div class="mb-5 flex flex-col items-start gap-3 rounded-xl border border-md-outline-variant bg-md-surface-bright px-4 py-4 shadow-sm sm:flex-row sm:items-center sm:justify-between sm:px-6">
          <div class="flex min-w-0 items-start gap-3">
            <button
              id="sidebar-open"
              type="button"
              title="Abrir panel de configuración"
              aria-label="Abrir el panel de configuración"
              aria-controls="sidebar"
              aria-expanded="false"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-md-outline-variant bg-md-surface/70 text-md-on-surface transition hover:bg-md-surface-container md:hidden"
            ></button>
            <div class="min-w-0">
              <h1 id="view-title" class="flex items-center gap-2 text-lg font-bold text-md-on-surface sm:text-xl">
                Permutaciones y Reversals
              </h1>
              <p id="view-subtitle" class="text-[12px] text-md-on-surface-variant sm:text-[13px]">
                Programación interactiva paso a paso sobre secuencias biológicas
              </p>
            </div>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <span
              id="playback-status"
              class="whitespace-nowrap rounded-full bg-md-secondary-container px-4 py-1.5 text-xs font-semibold text-md-on-secondary-container"
              >Inicializado</span
            >
          </div>
        </div>

        <div id="alert-area" role="alert" aria-live="polite" class="mb-4"></div>

        <section id="view-root" class="min-h-[400px]"></section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
